<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskRug</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent !important;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Tahoma, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  body.over { cursor: grab; }
  body.grabbing { cursor: grabbing; }

  /* TELEGRAM DESKTOP ACRYLIC MENU STYLING */
  #tg-menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999999;
    font-size: 13px;
    color: #e4ecf2;
    direction: ltr;
  }
  #tg-backdrop {
    position: absolute;
    inset: 0;
    background: transparent;
  }
  .tg-panel {
    position: absolute;
    background: rgba(23, 33, 43, 0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.35);
    border-radius: 10px;
    padding: 5px;
    width: 215px;
    display: flex;
    flex-direction: column;
    animation: tgFadeIn 0.12s cubic-bezier(0.2, 0, 0, 1);
    z-index: 1000000;
  }
  #sub-menu {
    width: 250px;
  }
  @keyframes tgFadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }
  .tg-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 1px;
    max-height: 345px;
  }
  .tg-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .tg-scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 4px;
  }
  .tg-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  .tg-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.08s ease, color 0.08s ease;
    white-space: nowrap;
    color: #e4ecf2;
    min-height: 32px;
  }
  .tg-item:hover, .tg-item.active-sub {
    background: rgba(82, 136, 193, 0.22);
    color: #ffffff;
  }
  .tg-item.danger:hover {
    background: rgba(234, 67, 53, 0.22);
    color: #ff6b6b;
  }
  .tg-label {
    flex: 1;
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tg-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 17px;
    height: 17px;
    opacity: 0.85;
    flex-shrink: 0;
  }
  .tg-item:hover .tg-icon, .tg-item.active-sub .tg-icon {
    opacity: 1;
  }
  .tg-arrow {
    display: inline-flex;
    align-items: center;
    opacity: 0.5;
    margin-left: 2px;
  }
  .tg-separator {
    height: 1px;
    background: rgba(255, 255, 255, 0.07);
    margin: 4px 6px;
    flex-shrink: 0;
  }
  .tg-check {
    width: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #sub-header {
    padding: 3px 3px 6px 3px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tg-search-input {
    width: 100%;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    color: #fff;
    padding: 6px 9px;
    font-size: 12px;
    outline: none;
    box-sizing: border-box;
    font-family: inherit;
  }
  .tg-search-input:focus {
    border-color: #5288c1;
    background: rgba(0, 0, 0, 0.65);
  }
  .tg-badge {
    font-size: 11px;
    background: rgba(255, 255, 255, 0.1);
    padding: 1px 6px;
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.6);
    margin-left: auto;
    flex-shrink: 0;
  }
  .tg-group-header {
    font-size: 11px;
    font-weight: 600;
    color: #5288c1;
    padding: 8px 10px 3px 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.9;
  }
  .tg-back-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #5288c1;
    background: rgba(82, 136, 193, 0.1);
    transition: background 0.08s ease, color 0.08s ease;
  }
  .tg-back-btn:hover {
    background: rgba(82, 136, 193, 0.22);
    color: #ffffff;
  }
</style>
</head>

<script>
  (function() {
    function sendLog(msg) {
      try {
        if (window.__TAURI__?.core?.invoke) {
          window.__TAURI__.core.invoke('log_from_js', { msg: String(msg) }).catch(() => {});
        } else if (window.__TAURI_INTERNALS__?.invoke) {
          window.__TAURI_INTERNALS__.invoke('log_from_js', { msg: String(msg) }).catch(() => {});
        }
      } catch(e) {}
    }
    window.addEventListener('error', function(e) {
      sendLog('[JS_ERR] ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      sendLog('[JS_REJECT] ' + (e.reason?.stack || e.reason));
    });
    window.addEventListener('DOMContentLoaded', function() {
      sendLog('DOM fully loaded');
    });
    sendLog('DeskRug index.html initialized');

    const listeners = [];

    async function getTauri() {
      if (window.__TAURI__) return window.__TAURI__;
      for (let i = 0; i < 50; i++) {
        await new Promise(r => setTimeout(r, 10));
        if (window.__TAURI__) return window.__TAURI__;
      }
      return window.__TAURI__;
    }

    window.halim = {
      setIgnoreMouse: function(ignore) {
        if (window.isCustomMenuOpen && ignore) {
          return;
        }
        if (window.__TAURI__?.core?.invoke) {
          window.__TAURI__.core.invoke('set_ignore_mouse', { ignore: !!ignore }).catch(console.error);
        }
      },
      showMenu: function(e) {
        let x = (e && e.clientX != null) ? e.clientX : lastPointerX;
        let y = (e && e.clientY != null) ? e.clientY : lastPointerY;
        openCustomMenuAt(x, y, false);
      },
      saveState: function(state) {
        if (window.__TAURI__?.core?.invoke) {
          window.__TAURI__.core.invoke('save_state', { state }).catch(console.error);
        }
      },
      loadState: async function() {
        const tauri = await getTauri();
        if (tauri?.core?.invoke) {
          try {
            return await tauri.core.invoke('load_state');
          } catch (e) {
            return null;
          }
        }
        return null;
      },
      getWallpaper: async function() {
        const tauri = await getTauri();
        if (tauri?.core?.invoke) {
          try {
            return await tauri.core.invoke('get_wallpaper');
          } catch (e) {
            return null;
          }
        }
        return null;
      },
      reportState: function(state) {
        if (state) {
          if (state.style) currentState.style = state.style;
          if (state.size) currentState.size = state.size;
          if (state.weight) currentState.weight = state.weight;
          if (window.__TAURI__?.core?.invoke) {
            window.__TAURI__.core.invoke('report_state', { state }).catch(() => {});
          }
        }
      },
      onCommand: function(fn) {
        listeners.push(fn);
      },
      log: function(msg) {
        if (window.__TAURI__?.core?.invoke) {
          window.__TAURI__.core.invoke('log_from_js', { msg: String(msg) }).catch(() => {});
        }
      }
    };

    function attachListener() {
      if (window.__TAURI__?.event?.listen) {
        window.__TAURI__.event.listen('command', function(event) {
          const payload = event.payload;
          if (payload && payload.cmd) {
            if (payload.cmd in currentState) {
              currentState[payload.cmd] = payload.arg;
            }
            for (let i = 0; i < listeners.length; i++) {
              listeners[i](payload.cmd, payload.arg);
            }
          }
        });
        window.__TAURI__.event.listen('open_custom_menu', function(event) {
          const isTray = event?.payload?.is_tray !== false;
          openCustomMenuAt(window.innerWidth - 230, window.innerHeight - 50, isTray);
        });
      } else {
        setTimeout(attachListener, 10);
      }
    }
    attachListener();

    window.dispatchCarpetCmd = function(cmd, arg) {
      closeCustomMenu();
      for (let i = 0; i < listeners.length; i++) {
        listeners[i](cmd, arg);
      }
    };
  })();

            catId: c.id,
            catTitle: c.title,
            groupTitle: g.title
          });
        });
      });
    } else {
      c.styles.forEach(s => {
        ALL_RUGS.push({
          ...s,
          catId: c.id,
          catTitle: c.title,
          groupTitle: ''
        });
      });
    }
  });

  let lastPointerX = Math.round(window.innerWidth / 2);
  let lastPointerY = Math.round(window.innerHeight / 2);
  window.addEventListener('pointermove', function(e) {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
  }, { passive: true });
  window.addEventListener('contextmenu', function(e) {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
  }, true);

  const overlay = document.getElementById('tg-menu-overlay');
  const mainMenu = document.getElementById('main-menu');
  const subPanel = document.getElementById('sub-menu');
  const subHeader = document.getElementById('sub-header');
  const subItems = document.getElementById('sub-items');

  window.isCustomMenuOpen = false;
  let lastMenuOpenTime = 0;

  function handleBackdropClick(e) {
    if (Date.now() - lastMenuOpenTime < 250) {
      return;
    }
    closeCustomMenu();
  }

  function openCustomMenuAt(clientX, clientY, isTray) {
    const now = Date.now();
    if (isTray && window.isCustomMenuOpen) {
      if (now - lastMenuOpenTime < 350) {
        return;
      }
      closeCustomMenu();
      return;
    }
    window.isCustomMenuOpen = true;
    lastMenuOpenTime = now;
    closeSub();
    overlay.style.display = 'block';

    if (isTray) {
      mainMenu.style.left = 'auto';
      mainMenu.style.right = '12px';
      mainMenu.style.top = 'auto';
      mainMenu.style.bottom = '48px';
    } else {
      let left = (clientX != null) ? clientX : lastPointerX;
      let top = (clientY != null) ? clientY : lastPointerY;
      if (left + 230 > window.innerWidth - 10) {
        left = window.innerWidth - 240;
      }
      if (top + 240 > window.innerHeight - 40) {
        top = window.innerHeight - 250;
      }
      mainMenu.style.right = 'auto';
      mainMenu.style.bottom = 'auto';
      mainMenu.style.left = Math.max(10, left) + 'px';
      mainMenu.style.top = Math.max(10, top) + 'px';
    }

    if (window.__TAURI__?.core?.invoke) {
      window.__TAURI__.core.invoke('set_menu_mode', { open: true }).catch(console.error);
    }
  }

  function closeCustomMenu() {
    window.isCustomMenuOpen = false;
    closeSub();
    overlay.style.display = 'none';
    if (window.__TAURI__?.core?.invoke) {
      window.__TAURI__.core.invoke('set_menu_mode', { open: false }).catch(() => {});
    } else if (window.__TAURI_INTERNALS__?.invoke) {
      window.__TAURI_INTERNALS__.invoke('set_menu_mode', { open: false }).catch(() => {});
    }
    window.__resetHover?.();
  }

  function openSub(name) {
    currentSub = name;
    document.querySelectorAll('.has-sub').forEach(el => el.classList.remove('active-sub'));
    const parentItem = document.getElementById('item-' + name);
    if (parentItem) parentItem.classList.add('active-sub');

    if (name === 'styles') {
      selectedCategory = null;
      rugSearchQuery = '';
      renderStylesMenu();
    } else if (name === 'sizes') {
      subHeader.style.display = 'none';
      subItems.innerHTML = SIZES.map(item => `
        <div class="tg-item" onclick="selectSubCommand('size', '${item.id}')">
          <span class="tg-check">${item.id === currentState.size ? checkSvg() : ''}</span>
          <span class="tg-label">${item.label}</span>
        </div>
      `).join('');
    } else if (name === 'weights') {
      subHeader.style.display = 'none';
      subItems.innerHTML = WEIGHTS.map(item => `
        <div class="tg-item" onclick="selectSubCommand('weight', '${item.id}')">
          <span class="tg-check">${item.id === currentState.weight ? checkSvg() : ''}</span>
          <span class="tg-label">${item.label}</span>
        </div>
      `).join('');
    }

    positionSubPanel(parentItem);
  }

  function checkSvg() {
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5288c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  }

  function renderStylesMenu() {
    const activeId = currentState.style;

    if (rugSearchQuery.trim()) {
      // SEARCH MODE
      const q = rugSearchQuery.trim().toLowerCase();
      const matches = ALL_RUGS.filter(r => 
        r.id.toLowerCase().includes(q) ||
        r.name.toLowerCase().includes(q) ||
        r.origin.toLowerCase().includes(q) ||
        r.catTitle.toLowerCase().includes(q)
      );

      subHeader.style.display = 'flex';
      subHeader.innerHTML = `
        <input type="text" class="tg-search-input" id="rug-search-field" placeholder="Search 237 patterns..." value="${escapeHtml(rugSearchQuery)}" oninput="onSearchChange(this.value)" autocomplete="off">
      `;

      if (matches.length === 0) {
        subItems.innerHTML = '<div style="padding: 18px 10px; text-align: center; color: rgba(255,255,255,0.4); font-size: 12px;">No matching patterns</div>';
      } else {
        subItems.innerHTML = matches.map(r => `
          <div class="tg-item" onclick="selectSubCommand('style', '${r.id}')">
            <span class="tg-check">${r.id === activeId ? checkSvg() : ''}</span>
            <span class="tg-label" title="${r.origin ? r.origin : ''}">${r.name}</span>
            <span class="tg-badge">${r.catTitle}</span>
          </div>
        `).join('');
      }

      const inp = document.getElementById('rug-search-field');
      if (inp) { inp.focus(); }
      return;
    }

    if (selectedCategory) {
      // CATEGORY DETAIL VIEW
      const cat = CATALOG.find(c => c.id === selectedCategory);
      subHeader.style.display = 'flex';
      subHeader.innerHTML = `
        <div class="tg-back-btn" onclick="backToCategories()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <span>${cat.title}</span>
        </div>
      `;

      let html = '';
      if (cat.subgroups) {
        cat.subgroups.forEach(g => {
          html += `<div class="tg-group-header">${g.title}</div>`;
          g.styles.forEach(s => {
            html += `
              <div class="tg-item" onclick="selectSubCommand('style', '${s.id}')">
                <span class="tg-check">${s.id === activeId ? checkSvg() : ''}</span>
                <span class="tg-label" title="${s.origin ? s.origin : ''}">${s.name}</span>
              </div>
            `;
          });
        });
      } else {
        cat.styles.forEach(s => {
          html += `
            <div class="tg-item" onclick="selectSubCommand('style', '${s.id}')">
              <span class="tg-check">${s.id === activeId ? checkSvg() : ''}</span>
              <span class="tg-label" title="${s.origin ? s.origin : ''}">${s.name}</span>
            </div>
          `;
        });
      }
      subItems.innerHTML = html;
      return;
    }

    // ROOT CATEGORIES VIEW
    subHeader.style.display = 'flex';
    subHeader.innerHTML = `
      <input type="text" class="tg-search-input" id="rug-search-field" placeholder="Search 237 patterns..." value="" oninput="onSearchChange(this.value)" autocomplete="off">
    `;

    subItems.innerHTML = CATALOG.map(cat => {
      const count = cat.subgroups ? cat.subgroups.reduce((a, b) => a + b.styles.length, 0) : cat.styles.length;
      const icon = CAT_ICONS[cat.id] || '🏛️';
      return `
        <div class="tg-item" onclick="chooseCategory('${cat.id}')">
          <span style="font-size: 14px; width: 18px; text-align: center;">${icon}</span>
          <span class="tg-label">${cat.title}</span>
          <span class="tg-badge">${count}</span>
          <span class="tg-arrow">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </div>
      `;
    }).join('');
  }

  function onSearchChange(val) {
    rugSearchQuery = val;
    renderStylesMenu();
  }

  function chooseCategory(id) {
    selectedCategory = id;
    rugSearchQuery = '';
    renderStylesMenu();
    subItems.scrollTop = 0;
  }

  function backToCategories() {
    selectedCategory = null;
    rugSearchQuery = '';
    renderStylesMenu();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function positionSubPanel(parentItem) {
    const parentRect = parentItem.getBoundingClientRect();
    const mainRect = mainMenu.getBoundingClientRect();

    if (mainRect.right + 260 <= window.innerWidth) {
      subPanel.style.left = Math.round(mainRect.right + 6) + 'px';
      subPanel.style.right = 'auto';
    } else {
      subPanel.style.left = Math.round(mainRect.left - 257) + 'px';
      subPanel.style.right = 'auto';
    }

    let subHeight = Math.min(380, 10 * 34 + 14);
    let topPos = parentRect.top - 4;
    if (topPos + subHeight > window.innerHeight - 10) {
      topPos = Math.max(10, window.innerHeight - subHeight - 10);
    }
    if (topPos < 10) topPos = 10;
    subPanel.style.top = topPos + 'px';
    subPanel.style.bottom = 'auto';
    subPanel.style.display = 'flex';
  }

  function closeSub() {
    currentSub = null;
    selectedCategory = null;
    rugSearchQuery = '';
    document.querySelectorAll('.has-sub').forEach(el => el.classList.remove('active-sub'));
    subPanel.style.display = 'none';
  }

  function selectSubCommand(cmd, arg) {
    currentState[cmd] = arg;
    dispatchCarpetCmd(cmd, arg);
  }

  function quitApp() {
    try {
      if (window.halim?.saveState) {
        window.halim.saveState(currentState);
      }
      if (window.__TAURI__?.core?.invoke) {
        window.__TAURI__.core.invoke('quit_app').catch(() => {});
      } else if (window.__TAURI_INTERNALS__?.invoke) {
        window.__TAURI_INTERNALS__.invoke('quit_app').catch(() => {});
      }
    } catch(e) {}
  }
</script>
<script src="bundle.js"></script>
</body>
</html>
